[project]
name = "taiyi-web"
version = "0.1.0"
description = "chat UI plugin — 内嵌 vanilla HTML + JS 流式渲染"
requires-python = ">=3.11"
dependencies = ["taiyi-cordis", "fastapi>=0.110"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_web"]