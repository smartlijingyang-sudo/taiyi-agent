<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>太一 · Taiyi Agent</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0e1116;
    --bg-soft: #161b22;
    --fg: #e6edf3;
    --fg-soft: #9da7b3;
    --accent: #2f81f7;
    --user: #1f6feb;
    --assistant: #161b22;
    --border: #30363d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
  }
  .app {
    display: flex; flex-direction: column;
    max-width: 800px; margin: 0 auto;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-soft);
    display: flex; align-items: center; gap: 10px;
  }
  header .logo {
    font-size: 22px; font-weight: 600;
    background: linear-gradient(135deg, #2f81f7, #8957e5);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header .subtitle {
    color: var(--fg-soft); font-size: 13px;
  }
  #messages {
    flex: 1; overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    background: var(--user);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    background: var(--assistant);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    color: var(--fg-soft);
    font-size: 13px;
    align-self: center;
    background: transparent;
    border: 1px dashed var(--border);
  }
  .msg.tool {
    color: var(--fg-soft);
    font-size: 12px;
    align-self: flex-start;
    background: #0b1d2e;
    border: 1px solid #1c3548;
    padding: 6px 10px;
    border-radius: 6px;
  }
  footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-soft);
    display: flex; gap: 10px;
  }
  textarea {
    flex: 1; resize: none;
    background: #0d1117;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    max-height: 180px;
    min-height: 40px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 0 18px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  button:hover { opacity: .92; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .typing::after {
    content: '▌';
    animation: blink 1s infinite;
    color: var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">太一</div>
      <div class="subtitle">Taiyi-Agent · Python 版 deepseek-harness MVP</div>
    </header>
    <div id="messages"></div>
    <footer>
      <textarea id="input" placeholder="输入消息（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
      <button id="send">发送</button>
    </footer>
  </div>
<script>
const $messages = document.getElementById('messages');
const $input = document.getElementById('input');
const $send = document.getElementById('send');

let sessionId = null;
let busy = false;

function append(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = '';
  if (role === 'assistant') el.classList.add('typing');
  $messages.appendChild(el);
  $messages.scrollTop = $messages.scrollHeight;
  return el;
}

function appendText(role, text) {
  const el = append(role, text);
  el.textContent = text;
  $messages.scrollTop = $messages.scrollHeight;
  return el;
}

function setBusy(b) {
  busy = b;
  $send.disabled = b;
  $input.disabled = b;
}

async function send() {
  if (busy) return;
  const text = $input.value.trim();
  if (!text) return;
  $input.value = '';

  appendText('user', text);
  const assistantEl = append('assistant', '');
  setBusy(true);

  try {
    const resp = await fetch('/v1/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text })
    });
    if (!resp.ok) {
      assistantEl.textContent = '[错误] HTTP ' + resp.status;
      assistantEl.classList.remove('typing');
      return;
    }
    sessionId = resp.headers.get('X-Session-Id') || sessionId;

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let acc = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const ev = JSON.parse(line);
          if (ev.event === 'session/start') {
            sessionId = ev.session_id;
          } else if (ev.event === 'assistant/chunk') {
            acc += ev.delta;
            assistantEl.textContent = acc;
            $messages.scrollTop = $messages.scrollHeight;
          } else if (ev.event === 'assistant/message') {
            acc = ev.content;
            assistantEl.textContent = acc;
            assistantEl.classList.remove('typing');
            $messages.scrollTop = $messages.scrollHeight;
          } else if (ev.event === 'tool/call') {
            const t = append('tool', `🔧 调用 ${ev.name}`);
          } else if (ev.event === 'tool/result') {
            const t = append('tool', `   ↳ ${ev.content.slice(0, 200)}${ev.content.length > 200 ? '…' : ''}`);
          } else if (ev.event === 'error') {
            assistantEl.textContent = '[错误] ' + ev.error;
            assistantEl.classList.remove('typing');
          }
        } catch (e) {
          console.warn('parse fail', e, line);
        }
      }
    }
    assistantEl.classList.remove('typing');
  } catch (e) {
    assistantEl.textContent = '[网络错误] ' + e.message;
    assistantEl.classList.remove('typing');
  } finally {
    setBusy(false);
  }
}

$send.addEventListener('click', send);
$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// 自动 resize
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 180) + 'px';
});

// 首屏欢迎
appendText('system', '欢迎使用 太一 (Taiyi) · MVP。输入消息开始对话。');
</script>
</body>
</html>
