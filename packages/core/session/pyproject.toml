[project]
name = "taiyi-core-session"
version = "0.1.0"
description = "taiyi-core-session — event-sourced session log + in-memory store + derived LLM message history"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-core-scope",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_core_session"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore:coroutine 'Fiber._reload' was never awaited:RuntimeWarning",
    "ignore:coroutine 'SessionStore.flush' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/taiyi_core_session"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N", "ASYNC"]
ignore = ["E501", "B008"]

[tool.pyright]
pythonVersion = "3.11"
strict = ["src/taiyi_core_session", "tests"]
exclude = ["invariant"]