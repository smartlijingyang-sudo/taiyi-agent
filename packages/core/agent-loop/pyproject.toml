[project]
name = "taiyi-core-agent-loop"
version = "0.1.0"
description = "默认 driver：实现 turn/step 模型-工具-循环"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-cosmokit",
    "taiyi-core-sessions",
    "taiyi-core-system-prompt",
    "taiyi-core-tools",
    "taiyi-core-agent",
    "taiyi-llm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_core_agent_loop"]