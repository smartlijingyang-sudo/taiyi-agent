[project]
name = "taiyi-core-agent"
version = "0.1.0"
description = "Agent interface, live registry, agent/* events"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-cosmokit",
    "taiyi-core-sessions",
    "taiyi-core-system-prompt",
    "taiyi-core-tools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_core_agent"]