[project]
name = "taiyi-core-sessions"
version = "0.1.0"
description = "SessionEvent append-only log + in-memory store (对标 dsh-core-session)"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-cosmokit",
    "taiyi-schemastery",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_core_sessions"]