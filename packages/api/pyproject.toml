[project]
name = "taiyi-api"
version = "0.1.0"
description = "gateway/BFF plugin — POST /v1/chat 流式 NDJSON, GET /v1/healthz"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-core-sessions",
    "taiyi-core-agent",
    "taiyi-core-agent-loop",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_api"]