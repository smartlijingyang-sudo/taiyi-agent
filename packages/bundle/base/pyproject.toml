[project]
name = "taiyi-bundle-base"
version = "0.1.0"
description = "dsh-base 等价物：mount core + llm + deepseek"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-core-sessions",
    "taiyi-core-system-prompt",
    "taiyi-core-tools",
    "taiyi-core-agent",
    "taiyi-core-agent-loop",
    "taiyi-llm",
    "taiyi-llm-deepseek",
    "taiyi-llm-retry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_bundle_base"]