[project]
name = "taiyi-bundle-web-app"
version = "0.1.0"
description = "dsh-web-app 等价物：mount host + api + web"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-bundle-base",
    "taiyi-host-webserver",
    "taiyi-api",
    "taiyi-web",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_bundle_web_app"]