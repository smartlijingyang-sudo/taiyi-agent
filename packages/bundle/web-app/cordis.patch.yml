# The taiyi-web-app bundle patch: the browser surface over the taiyi-base layer.
# Applied after taiyi-base's insert.

- insert:
    # Web server host
    - id: webserver
      name: taiyi_host_webserver.plugin:setup
      config:
        host: "0.0.0.0"
        port: 39191

    # API gateway
    - id: api
      name: taiyi_api.plugin:setup

    # Web UI
    - id: web
      name: taiyi_web.plugin:setup
