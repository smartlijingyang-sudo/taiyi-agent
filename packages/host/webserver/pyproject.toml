[project]
name = "taiyi-host-webserver"
version = "0.1.0"
description = "FastAPI host plugin — 暴露 app 给其它 plugin 加 routes"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_host_webserver"]