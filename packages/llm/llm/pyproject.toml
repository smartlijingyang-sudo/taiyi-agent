[project]
name = "taiyi-llm"
version = "0.1.0"
description = "LLM 能力 seam：消息 / 流词汇 + adapter 接口"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-cosmokit",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_llm"]