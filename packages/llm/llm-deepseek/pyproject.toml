[project]
name = "taiyi-llm-deepseek"
version = "0.1.0"
description = "DeepSeek LLM provider（OpenAI-compatible 流式 HTTP）"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-llm",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_llm_deepseek"]