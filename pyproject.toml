[project]
name = "taiyi-agent"
version = "0.1.0"
description = "Taiyi-Agent — 1:1 Python rebuild of deepseek-harness"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-core-scope",
    "taiyi-core-session",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_agent"]

[tool.uv.workspace]
members = ["vendor/*", "packages/*/*"]

[tool.uv.sources]
taiyi-cordis = { workspace = true }
taiyi-cosmokit = { workspace = true }
taiyi-schemastery = { workspace = true }
taiyi-timer = { workspace = true }
taiyi-hmr = { workspace = true }
taiyi-logger-console = { workspace = true }
taiyi-core-scope = { workspace = true }
taiyi-core-session = { workspace = true }
taiyi-loader = { workspace = true }
taiyi-group = { workspace = true }
taiyi-include = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage>=7.0",
    "pyright>=1.1",
    "ruff>=0.5",
]
