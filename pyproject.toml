[project]
name = "taiyi-agent"
version = "0.1.0"
description = "Taiyi-Agent — 1:1 Python rebuild of deepseek-harness"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_agent"]

[tool.uv.workspace]
members = ["vendor/*"]

[tool.uv.sources]
taiyi-cordis = { workspace = true }
