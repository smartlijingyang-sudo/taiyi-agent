[project]
name = "taiyi-group"
version = "1.0.0"
description = "Entry group service (vendored @deepseek-ai/cordis-plugin-group)"
requires-python = ">=3.11"
dependencies = ["taiyi-cordis", "taiyi-loader"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_group"]
