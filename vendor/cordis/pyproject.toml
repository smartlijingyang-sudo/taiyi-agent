[project]
name = "taiyi-cordis"
version = "1.0.0"
description = "一切皆插件 — Python 复刻 @deepseek-ai/cordis 的核心 surface"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cosmokit",
    "taiyi-schemastery",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cordis"]