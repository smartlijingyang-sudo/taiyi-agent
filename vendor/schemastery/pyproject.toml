[project]
name = "taiyi-schemastery"
version = "1.0.0"
description = "轻量 schema 校验（dict → typed config）。复刻 deepseek-harness vendor/schemastery 的核心 surface。"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemastery"]