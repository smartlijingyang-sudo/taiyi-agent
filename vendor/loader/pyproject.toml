[project]
name = "taiyi-loader"
version = "1.0.0"
description = "Plugin loader with entry tree (vendored @deepseek-ai/cordis-plugin-loader)"
requires-python = ">=3.11"
dependencies = ["taiyi-cordis", "taiyi-cosmokit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_loader"]
