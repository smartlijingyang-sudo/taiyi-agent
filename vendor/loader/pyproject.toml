[project]
name = "taiyi-loader"
version = "0.1.0"
description = "Taiyi-loader — 1:1 Python port of @deepseek-ai/cordis-plugin-loader"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
    "taiyi-schemastery",
    "taiyi-cosmokit",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    # Fiber construction schedules _reload() via asyncio.ensure_future().
    "ignore:coroutine 'Fiber._reload' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/loader"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N", "ASYNC"]
ignore = ["E501", "B008"]

[tool.pyright]
pythonVersion = "3.11"
strict = ["src/loader"]
exclude = ["invariant", "tests"]

[tool.uv.sources]
taiyi-cordis = { workspace = true }
taiyi-cosmokit = { workspace = true }
taiyi-schemastery = { workspace = true }
