[project]
name = "taiyi-timer"
version = "1.0.0"
description = "Timer service with auto-disposal (vendored @deepseek-ai/cordis-plugin-timer)"
requires-python = ">=3.11"
dependencies = ["taiyi-cordis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_timer"]
