[project]
name = "taiyi-logger-console"
version = "1.0.0"
description = "Console logger exporter (vendored @deepseek-ai/cordis-plugin-logger-console)"
requires-python = ">=3.11"
dependencies = ["taiyi-cordis", "taiyi-cosmokit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi_logger_console"]
