[project]
name = "taiyi-logger-console"
version = "0.1.0"
description = "taiyi-logger-console — 1:1 Python port of @deepseek-ai/logger-console"
requires-python = ">=3.11"
dependencies = [
    "taiyi-cordis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logger_console"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/logger_console"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N", "ASYNC"]
ignore = ["E501", "B008"]

[tool.pyright]
pythonVersion = "3.11"
strict = ["src/logger_console", "tests"]
